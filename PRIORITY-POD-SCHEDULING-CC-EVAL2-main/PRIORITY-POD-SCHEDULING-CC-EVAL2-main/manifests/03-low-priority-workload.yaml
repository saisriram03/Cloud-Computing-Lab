apiVersion: apps/v1
kind: Deployment
metadata:
  name: low-priority-workload
  namespace: priority-demo
  labels:
    app: low-priority-workload
    tier: batch
spec:
  replicas: 3
  selector:
    matchLabels:
      app: low-priority-workload
  template:
    metadata:
      labels:
        app: low-priority-workload
        tier: batch
    spec:
      priorityClassName: demo-low-priority
      terminationGracePeriodSeconds: 5
      containers:
        - name: worker
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              memory: "2Gi"
            limits:
              memory: "2Gi"
