apiVersion: v1
kind: Pod
metadata:
  name: high-priority-critical-pod
  namespace: priority-demo
  labels:
    app: critical-service
    tier: critical
spec:
  priorityClassName: demo-high-priority
  terminationGracePeriodSeconds: 5
  containers:
    - name: critical-app
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          memory: "2Gi"
        limits:
          memory: "2Gi"
