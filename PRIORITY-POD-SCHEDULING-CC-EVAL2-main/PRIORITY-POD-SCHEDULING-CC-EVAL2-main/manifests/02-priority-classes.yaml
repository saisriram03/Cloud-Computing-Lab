apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: demo-low-priority
value: 100
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Low-priority class for batch jobs or non-critical workloads that can be preempted."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: demo-medium-priority
value: 500
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Medium-priority class for standard application workloads."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: demo-high-priority
value: 1000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "High-priority class for mission-critical workloads allowed to preempt lower-priority pods."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: demo-high-priority-non-preempting
value: 1000
globalDefault: false
preemptionPolicy: Never
description: "High-priority class that jumps to the front of the scheduling queue without evicting running pods."
