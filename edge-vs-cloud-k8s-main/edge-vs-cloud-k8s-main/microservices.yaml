apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-service
  template:
    metadata:
      labels:
        app: edge-service
    spec:
      nodeSelector:
        node-type: edge
      containers:
        - name: edge-service
          image: hashicorp/http-echo
          args:
            - -text=Hello from the EDGE microservice
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: edge-service
spec:
  selector:
    app: edge-service
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-service
  template:
    metadata:
      labels:
        app: cloud-service
    spec:
      nodeSelector:
        node-type: cloud
      containers:
        - name: cloud-service
          image: hashicorp/http-echo
          args:
            - -text=Hello from the CLOUD microservice
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-service
spec:
  selector:
    app: cloud-service
  ports:
    - port: 80
      targetPort: 5678
