<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Microservice Lab Architecture</title>
  <desc id="desc">API Gateway connects client requests to user, product, and order services.</desc>
  <rect width="960" height="540" fill="#f7f9fc"/>
  <rect x="50" y="50" width="860" height="440" rx="8" fill="#ffffff" stroke="#c8d3e0" stroke-width="2"/>
  <text x="480" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d2733">Microservice Lab Architecture</text>
  <rect x="90" y="220" width="150" height="90" rx="8" fill="#e8f4ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="165" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Client</text>
  <text x="165" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#315170">Browser / curl</text>
  <rect x="385" y="205" width="190" height="120" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="480" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#047857">API Gateway</text>
  <text x="480" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#315170">Port 3000</text>
  <rect x="710" y="145" width="160" height="80" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="790" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#c2410c">User Service</text>
  <text x="790" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#315170">Port 3001</text>
  <rect x="710" y="250" width="160" height="80" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="790" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">Product Service</text>
  <text x="790" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#315170">Port 3002</text>
  <rect x="710" y="355" width="160" height="80" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="790" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#6d28d9">Order Service</text>
  <text x="790" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#315170">Port 3003</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#44546a"/>
    </marker>
  </defs>
  <line x1="240" y1="265" x2="375" y2="265" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="575" y1="235" x2="700" y2="185" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="575" y1="265" x2="700" y2="290" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="575" y1="295" x2="700" y2="395" stroke="#44546a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="790" y1="355" x2="790" y2="335" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <line x1="710" y1="380" x2="675" y2="315" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
</svg>

