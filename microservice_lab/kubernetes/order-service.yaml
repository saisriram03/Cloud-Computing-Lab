apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservice-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: microservice-config
                  key: USER_SERVICE_URL
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: microservice-config
                  key: PRODUCT_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microservice-lab
spec:
  selector:
    app: order-service
  ports:
    - port: 3003
      targetPort: 3003

