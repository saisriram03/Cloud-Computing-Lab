apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microservice-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: microservice-lab
spec:
  selector:
    app: user-service
  ports:
    - port: 3001
      targetPort: 3001

