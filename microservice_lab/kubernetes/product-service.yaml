apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: microservice-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: microservice-lab
spec:
  selector:
    app: product-service
  ports:
    - port: 3002
      targetPort: 3002

