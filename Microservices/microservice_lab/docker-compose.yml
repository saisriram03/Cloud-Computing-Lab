services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8001:8000"
    restart: unless-stopped
    networks:
      - foodflow-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  restaurant-service:
    build: ./restaurant-service
    container_name: restaurant-service
    ports:
      - "8002:8000"
    restart: unless-stopped
    networks:
      - foodflow-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8003:8000"
    environment:
      USER_SERVICE_URL: http://user-service:8000
      RESTAURANT_SERVICE_URL: http://restaurant-service:8000
    depends_on:
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - foodflow-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  foodflow-network:
    driver: bridge
